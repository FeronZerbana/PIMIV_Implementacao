name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ feat/mobile ]
    paths:
      - 'MOBILE/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOBILE

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Baixar artefatos do Android (Flutter precache)
        run: flutter precache --android

      - name: Instalar dependencias do Flutter
        run: flutter pub get

      - name: Inspecionar ambiente (Flutter Doctor)
        run: flutter doctor -v

      - name: Compilar Android Release APK
        run: flutter build apk --release

      - name: Publicar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: MOBILE/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5
